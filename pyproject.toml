
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filesystem-importer"
version = "0.1.0"
description = "Standalone Filesystem Importer for Photo Manager"
requires-python = ">=3.10"
dependencies = [
    "PySide6",
    "platformdirs",
    "piexif",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "Pillow",
]

[project.scripts]
filesystem-importer = "filesystem_importer.main:main"

[tool.setuptools.packages.find]
where = ["src"]
